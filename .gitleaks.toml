# ==============================================================================
# SecureFlow DevSecOps: Gitleaks Configuration
# ==============================================================================
# This configuration extends Gitleaks default ruleset with strict detection
# and documented, scoped exceptions for synthetic test fixtures.
# ==============================================================================

title = "SecureFlow Secret Scanning Policy"

[extend]
useDefault = true

[allowlist]
description = "Narrowly scoped allowlist for synthetic test fixtures and unit tests"
# Exceptions must be explicitly justified and restricted to test directories.
# Never add application source paths (frontend/, services/) to this allowlist.
paths = [
    '''security/fixtures/test_secrets\.json''',
    '''security/tests/fixtures/.*''',
    '''tests/fixtures/.*''',
    '''\.gitleaks\.toml'''
]
regexes = [
    # Mock fake tokens used in documentation or comments
    '''EXAMPLE_TOKEN_DO_NOT_USE_[A-Za-z0-9_-]+''',
    '''AKIAIOSFODNN7EXAMPLE'''
]

[[rules]]
id = "secureflow-internal-api-key"
description = "Detected potential SecureFlow internal service communication key"
regex = '''(?i)(?:secureflow|sf)[-_]?(?:secret|key|token)\s*[:=]\s*['"][A-Za-z0-9_\-]{24,}['"]'''
secretGroup = 0
keywords = ["secureflow", "sf_secret", "sf_key"]
