[project]
name = "secureflow-policy-engine"
version = "1.0.0"
description = "SecureFlow DevSecOps Central Security Policy Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "python-dateutil>=2.9.0",
    "jinja2>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
