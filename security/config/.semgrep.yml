rules:
  - id: secureflow-no-eval
    patterns:
      - pattern: eval(...)
    message: "Detected dangerous use of 'eval()'. Dynamic evaluation of untrusted code leads to arbitrary code execution."
    languages: [javascript, typescript, python]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH

  - id: secureflow-no-insecure-hash
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: "Detected use of broken or weak cryptographic hash function (MD5/SHA1)."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  - id: secureflow-no-shell-true
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    message: "Detected 'subprocess' invocation with 'shell=True'. This is a high-risk pattern for OS command injection."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH

  - id: secureflow-no-dangerous-html
    patterns:
      - pattern: <$EL dangerouslySetInnerHTML={...} />
    message: "Detected 'dangerouslySetInnerHTML' in React. Unsanitized input can cause Cross-Site Scripting (XSS)."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
